[project]
name = "firespire"
version = "0.1.0"
description = "Firespire: armonización MODIS/VIIRS en celda-días H3 y export de artefactos"
authors = [
    { name = "FernandoAMartinez", email = "fernandomartinez0295@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "h3>=4.5.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "shapely>=2.2.0",
]

[project.scripts]
firespire = "firespire.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
